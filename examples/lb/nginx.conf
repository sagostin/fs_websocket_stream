# Example nginx reverse-proxy for fsbridge: TLS termination, WebSocket
# upgrade, per-call affinity, and long-lived connection hygiene.
#
#   FreeSWITCH (mod_ws_bridge) ──wss://──▶ nginx ──ws://──▶ fsbridge pool
#   agent app / control clients ──wss://──▶ nginx ──ws://──▶ fsbridge pool
#
# Notes:
# - proxy_read_timeout must exceed the longest expected call; WebSockets
#   are idle only when a call is silent, so keep this generous. The
#   STREAM_HEART_BEAT channel variable on the FS side also helps keep
#   intermediaries from killing quiet connections.
# - hash $arg_uuid consistent: the module puts the call UUID in the query
#   string, so every WS for a call lands on the same bridge instance.
#   Matters for /control commands that touch in-memory session state
#   (clear_playback). Barge-in clear from the agent app does not need this
#   (it travels over the call's own agent socket).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream fsbridge {
    hash $arg_uuid consistent;
    server 127.0.0.1:8090;
    server 127.0.0.1:8091;
    # server 10.0.0.12:8090;  # add replicas here
}

server {
    listen 443 ssl;
    server_name bridge.example.com;

    ssl_certificate     /etc/nginx/tls/bridge.example.com.crt;
    ssl_certificate_key /etc/nginx/tls/bridge.example.com.key;

    # Audio plane (FreeSWITCH module connects here).
    location /stream {
        proxy_pass http://fsbridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # permessage-deflate between nginx and fsbridge is fine; the module
        # negotiates it with nginx end-to-end.
    }

    # Control plane (your agent app / ops tooling connects here).
    location /control {
        proxy_pass http://fsbridge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;

        # Restrict by network or mTLS in production — /control is full
        # call control (originate/hangup/transfer).
        # allow 10.0.0.0/8;
        # deny all;
    }

    # Recording fetch API.
    location /recordings {
        proxy_pass http://fsbridge;
        proxy_read_timeout 120s;
        # allow 10.0.0.0/8;
        # deny all;
    }
}
